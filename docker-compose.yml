version: "3.8"

services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clfis_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clfis_db
      SECRET_KEY: your-secret-key-change-in-production
      CAMPUS_EMAIL_DOMAIN: college.edu
      HF_HOME: /root/.cache/huggingface
      # Read from .env (gitignored), never hardcoded here. Needed only for gated
      # weights such as DINOv3; empty is fine for ungated models like SigLIP.
      HF_TOKEN: ${HF_TOKEN:-}
      # auto -> CUDA when the GPU reservation below is honoured, CPU otherwise.
      SIGLIP_DEVICE: auto
    # Hand the container the host GPU. Needs the NVIDIA Container Toolkit; without
    # it the container still starts and SIGLIP_DEVICE=auto falls back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/backend/uploads
      # Persist the SigLIP weights (~400MB) so they survive container recreates
      # instead of being re-downloaded on the first report every time.
      - huggingface_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  huggingface_cache:
